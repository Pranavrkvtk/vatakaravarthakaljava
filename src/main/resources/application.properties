# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# ==========================================
# DATABASE CONFIGURATION (POSTGRESQL)
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/news}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# ==========================================
# JPA / HIBERNATE
# ==========================================
# NEVER use 'update' in production. Use 'validate' with Flyway.
spring.jpa.hibernate.ddl-auto=validate 
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.time-zone=Asia/Kolkata

# ==========================================
# FLYWAY (DATABASE MIGRATIONS)
# ==========================================
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ==========================================
# JWT SECURITY
# ==========================================
# Move to environment variable in production!
jwt.secret=${JWT_SECRET:bXlzdXBlcnNlY3JldGtleW15c3VwZXJzZWNyZXRrZXlteXN1cGVyc2VjcmV0a2V5}
# Reduce token lifespan from 7 days to 12 hours (43200 seconds)
jwt.expiration=43200

# ==========================================
# ADMIN INITIALIZATION
# ==========================================
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}

# ==========================================
# OBJECT STORAGE (S3 / CLOUDFLARE R2)
# ==========================================
# Replace these dummy values with your real keys when you are ready!
aws.s3.bucket-name=vadakara-images
aws.s3.region=auto
aws.s3.endpoint=https://dummy.r2.cloudflarestorage.com
aws.s3.access-key=${S3_ACCESS_KEY:dummy_access_key}
aws.s3.secret-key=${S3_SECRET_KEY:dummy_secret_key}
app.storage.public-base-url=https://dummy-public-url.com

# ==========================================
# CORS
# ==========================================
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000}

# ==========================================
# LOGGING & MONITORING
# ==========================================
logging.level.root=INFO
logging.level.com.example.newsjava=INFO
management.endpoints.web.exposure.include=health

# ==========================================
# FILE UPLOAD LIMITS
# ==========================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB