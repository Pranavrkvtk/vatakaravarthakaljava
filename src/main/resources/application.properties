# Server
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5433/news
spring.datasource.username=postgres
spring.datasource.password=root

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT - Comments must be on their own line!
jwt.secret=mysecretkeymysecretkeymysecretkeymysecretkey
# Changed from 86400000 to 604800 (7 days)
jwt.expiration=604800

logging.level.org.springframework.security=DEBUG
logging.level.com.example.newsjava=DEBUG

# File upload settings
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB