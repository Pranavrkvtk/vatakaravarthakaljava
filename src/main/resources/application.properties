# Server
server.port=8080
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

# PostgreSQL Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/news}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# JPA
# NEVER use 'update' in production. Use 'validate' with Flyway.
spring.jpa.hibernate.ddl-auto=validate 
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.time-zone=Asia/Kolkata

# Flyway (Fixes the "non-empty schema" error)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT
# Move to environment variable. Generate a new one!
jwt.secret=${JWT_SECRET:bXlzdXBlcnNlY3JldGtleW15c3VwZXJzZWNyZXRrZXlteXN1cGVyc2VjcmV0a2V5}
# Reduce token lifespan from 7 days to 12 hours (43200 seconds)
jwt.expiration=43200

# Admin Setup
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD:}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000}

# Logging & Monitoring
logging.level.root=INFO
logging.level.com.example.newsjava=INFO
management.endpoints.web.exposure.include=health

# File upload settings
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB